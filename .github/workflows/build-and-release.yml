name: Daily Build & Release OpenBot for Unraid

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Validate XML Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate XML & Scripts
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils shellcheck
          xmllint --noout templates/openbot.xml
          xmllint --noout ca_profile.xml
          shellcheck docker/extract.sh
          echo "All XML templates and scripts are valid."

  build-and-push:
    name: Multi-Arch Build from Upstream Release
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Upstream Release Information
        id: upstream
        run: |
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/nightly-labs/openbot/releases/latest)
          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          VERSION="${TAG_NAME#v}"
          echo "Found upstream version: $VERSION ($TAG_NAME)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "linux/amd64,linux/arm64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            TARGETARCH=amd64
            VERSION=${{ steps.upstream.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.upstream.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.upstream.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/openbot:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/openbot:${{ steps.upstream.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/openbot:${{ steps.upstream.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Checksums & Artifacts Digest
        run: |
          mkdir -p artifacts
          echo "Image Digest: ${{ steps.build_push.outputs.digest }}" > artifacts/docker-digest.txt
          echo "${{ steps.build_push.outputs.digest }}  ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.upstream.outputs.version }}" >> artifacts/sha256sums.txt
          sha256sum templates/openbot.xml >> artifacts/sha256sums.txt
          sha256sum ca_profile.xml >> artifacts/sha256sums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: artifacts/

  release:
    name: Sync Unraid Template & GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Upstream Release Information
        id: upstream
        run: |
          TAG_NAME=$(curl -fsSL https://api.github.com/repos/nightly-labs/openbot/releases/latest | jq -r '.tag_name')
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Build Checksums
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: artifacts/

      - name: Update Template Date
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          sed -i "s|<Date>.*</Date>|<Date>${RELEASE_DATE}</Date>|g" templates/openbot.xml
          cp templates/openbot.xml "artifacts/openbot-${{ steps.upstream.outputs.tag }}.xml"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: "OpenBot ${{ steps.upstream.outputs.tag }} for Unraid"
          body: |
            Automated build based on upstream [nightly-labs/openbot ${{ steps.upstream.outputs.tag }}](https://github.com/nightly-labs/openbot/releases/tag/${{ steps.upstream.outputs.tag }}).
            
            ### Included Artifacts
            - `openbot-${{ steps.upstream.outputs.tag }}.xml` - Unraid Community Applications Template
            - `sha256sums.txt` - Verification checksums
          files: |
            artifacts/*
            templates/openbot.xml
            docker/seccomp.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
